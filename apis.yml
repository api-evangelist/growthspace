apis:
- aid: growthspace-public-api-management
  name: Growthspace Public API Management
  description: >-
    The management surface for the Growthspace Public API. It lists the scope
    catalogue, creates and revokes Public API applications for a company, issues
    bearer tokens for an application, updates an application's granted scopes,
    and exposes a public token-refresh endpoint. The OpenAPI is served live by
    the service itself at /api/docs-json (Swagger UI at /api/docs); its
    info.title is "@growthspace-engineering/public-api-management" and its
    contact address is gsBot@growthspace.com, both of which identify it as
    Growthspace's own service.
  humanURL: https://public-api-management-dot-growthspace-246311.oa.r.appspot.com/api/docs
