aid: growthspace
name: GrowthSpace
description: >-
  Growthspace is a precision skill development platform for enterprise learning
  and talent teams. Using AI-driven matching it pairs individual employees and
  cohorts with a network of more than 2,800 vetted domain experts across 65+
  countries and 80+ skill sets, then runs and measures the resulting development
  sprints — 1:1 skill development, group skill development, workshops, internal
  and external mentoring, and the ExpertX on-demand expert surface. The platform
  handles skill-gap assessment, program execution, scheduling, and outcome
  measurement in one place, with native integrations into HRIS systems,
  Microsoft Viva Learning, Slack, Zoom and Teams. Growthspace runs a Public API
  whose OAuth-style applications, scopes and tokens are provisioned from the
  admin console; the scope catalogue covers programs, participants, workshops,
  company, reporting and integration surfaces in read and write variants.
  Headquartered in New York with customers including Siemens, Microsoft, EY and
  Johnson & Johnson.
