openapi: 3.2.0
info:
  title: '@growthspace-engineering/public-api-management Admin API'
  description: Management of GrowthSpace public API
  version: 0.0.0
  contact:
    name: gr0wth-b0t
    url: github.com/gr0wth-b0t
    email: gsBot@growthspace.com
servers: []
tags:
- name: Admin
paths:
  /admin/scopes:
    get:
      operationId: AppsManagementController_getScopes
      parameters: []
      responses:
        '200':
          description: ''
      tags:
      - Admin
      summary: Apps management controller get scopes
      x-summary-source: derived
  /admin/apps:
    post:
      operationId: AppsManagementController_createApp
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppDto'
      responses:
        '201':
          description: ''
      tags:
      - Admin
      summary: Apps management controller create app
      x-summary-source: derived
    get:
      operationId: AppsManagementController_listApps
      parameters:
      - name: companyId
        required: true
        in: query
        schema:
          type: string
      responses:
        '200':
          description: ''
      tags:
      - Admin
      summary: Apps management controller list apps
      x-summary-source: derived
  /admin/apps/{appId}/token:
    post:
      operationId: AppsManagementController_generateToken
      parameters:
      - name: appId
        required: true
        in: path
        schema:
          type: string
      responses:
        '201':
          description: ''
      tags:
      - Admin
      summary: Apps management controller generate token
      x-summary-source: derived
  /admin/apps/{appId}:
    delete:
      operationId: AppsManagementController_revokeApp
      parameters:
      - name: appId
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
      tags:
      - Admin
      summary: Apps management controller revoke app
      x-summary-source: derived
  /admin/apps/{appId}/scopes:
    put:
      operationId: AppsManagementController_updateScopes
      parameters:
      - name: appId
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScopesDto'
      responses:
        '200':
          description: ''
      tags:
      - Admin
      summary: Apps management controller update scopes
      x-summary-source: derived
  /admin/apps/{appId}/refresh:
    post:
      operationId: AppsManagementController_refreshForApp
      parameters:
      - name: appId
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenDto'
      responses:
        '201':
          description: ''
      tags:
      - Admin
      summary: Apps management controller refresh for app
      x-summary-source: derived
components:
  schemas:
    CreateAppDto:
      type: object
      properties: {}
    UpdateScopesDto:
      type: object
      properties: {}
    RefreshTokenDto:
      type: object
      properties: {}
