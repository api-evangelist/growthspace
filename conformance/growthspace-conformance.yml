- id: scim2
  conforms: false
  evidence: >-
    No SCIM schema URN, /scim/v2 path or ServiceProviderConfig is exposed.
    Recorded because SCIM is the standard an HR/talent platform's participant and
    employee provisioning surface would be expected to speak; Growthspace's
    participants.read / participants.write scopes cover the same territory with a
    proprietary shape, and HRIS synchronisation is brokered through Merge
    (cdn.merge.dev is loaded by app.growthspace.com) rather than a native
    standards-based provisioning endpoint.
