- id: oauth2
  conforms: false
  evidence: >-
    No oauth2 securityScheme is declared and no RFC 8414 authorization-server
    metadata is served. Applications use a clientId/clientSecret + bearer token
    issued by the provider's own admin endpoints, with a proprietary
    /public/refresh renewal call rather than an RFC 6749 token endpoint.
