    Errors are returned as {"msg": "..."} with content-type application/json,
    not application/problem+json. See errors/growthspace-problem-types.yml.
- id: rfc9116-security-txt
  conforms: false
  evidence: /.well-known/security.txt returns 404 on every host.
- id: rfc8594-sunset
  conforms: false
  evidence: No Sunset or Deprecation headers observed; no deprecation policy published.
- id: rfc8615-well-known
  conforms: false
  evidence: No /.well-known/ document is served on any host.
- id: a2a-agent-card
  conforms: false
  evidence: >-
